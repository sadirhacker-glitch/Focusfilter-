workflows:
  android-build:
    name: Android Build

    environment:
      java: 17

    scripts:
      - name: Install Gradle
        script: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          export PATH=$PWD/gradle-8.7/bin:$PATH

      - name: Build APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
