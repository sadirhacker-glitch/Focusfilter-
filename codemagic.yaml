workflows:
  android-build:
    name: Android Build
    environment:
      java: 17
    scripts:
      - name: Unpack FocusFilter
        script: |
          tar -xzf FocusFilter.tar.gz
          ls -la FocusFilter/
      - name: Generate Gradle Wrapper
        script: |
          cd FocusFilter
          gradle wrapper
          chmod +x gradlew
      - name: Build APK
        script: |
          cd FocusFilter
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - FocusFilter/app/build/outputs/**/*.apk
