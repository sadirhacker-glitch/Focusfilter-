workflows:
  android-build:
    name: Android Build
    environment:
      java: 17
    scripts:
      - name: Unpack FocusFilter
        script: |
          tar -xzf FocusFilter.tar.gz
          ls -la FocusFilter/
      - name: Build APK
        script: |
          cd FocusFilter
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - FocusFilter/app/build/outputs/**/*.apk
