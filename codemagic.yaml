workflows:
  android-build:
    name: Android Build
    environment:
      java: 17
    scripts:
      - name: List files (debugging)
        script: |
          pwd
          ls -la
          find . -name "settings.gradle" -type f
      - name: Build APK
        script: |
          # Navigate to the folder containing your build files
          cd FocusFilter 2>/dev/null || cd app 2>/dev/null || cd ..
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
